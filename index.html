<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0284c7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Calendario Piscina</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: #f0f9ff; color: #0f172a; padding: 16px; }
    .container { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    header button { background: #0284c7; color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-size: 16px; font-weight: bold; cursor: pointer; }
    header h2 { margin: 0; font-size: 19px; text-transform: capitalize; color: #0369a1; }
    .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .weekdays div { font-weight: 700; font-size: 13px; color: #64748b; padding-bottom: 6px; }
    .day { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0; font-weight: 600; font-size: 16px; cursor: pointer; position: relative; user-select: none; }
    .day.empty { background: transparent; border: none; cursor: default; }
    .day.booked { background: #fee2e2; border-color: #ef4444; color: #b91c1c; text-decoration: line-through; text-decoration-thickness: 2.5px; }
    .status-bar { margin-top: 14px; font-size: 12px; text-align: center; color: #64748b; }

    /* Ventana emergente (Modal) */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal-backdrop.active { display: flex; }
    .modal { background: #fff; width: 100%; max-width: 400px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal h3 { margin-top: 0; color: #0284c7; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #334155; }
    .field input, .field textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
    .field textarea { resize: vertical; min-height: 80px; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .actions button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .btn-save { background: #0284c7; color: #fff; }
    .btn-delete { background: #ef4444; color: #fff; }
    .btn-close { background: #e2e8f0; color: #334155; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <button id="prevMonth">&#9664;</button>
    <h2 id="monthYear"></h2>
    <button id="nextMonth">&#9654;</button>
  </header>

  <div class="weekdays">
    <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
  </div>
  <div class="days" id="calendarDays"></div>
  <div class="status-bar" id="syncStatus">Conectando con la nube...</div>
</div>

<!-- Modal de Reserva -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalDateTitle">Fecha</h3>
    <div class="field">
      <label>Nombre de la persona</label>
      <input type="text" id="clientName" placeholder="Ej. Carlos Pérez" />
    </div>
    <div class="field">
      <label>Número de teléfono</label>
      <input type="tel" id="clientPhone" placeholder="Ej. 0414-1234567" />
    </div>
    <div class="field">
      <label>Notas (Día del pago y referencia)</label>
      <textarea id="clientNotes" placeholder="Ej. Pagó el 15/12 - Ref: 849302"></textarea>
    </div>
    <div class="actions">
      <button class="btn-save" id="saveBtn">Guardar</button>
      <button class="btn-delete" id="deleteBtn">Liberar</button>
      <button class="btn-close" id="closeBtn">Cerrar</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdxQ-06sxgPet72sIxtLul0D6YGjm-uh0",
    authDomain: "calendario-de-picina.firebaseapp.com",
    databaseURL: "https://calendario-de-picina-default-rtdb.firebaseio.com",
    projectId: "calendario-de-picina",
    storageBucket: "calendario-de-picina.firebasestorage.app",
    messagingSenderId: "921723174722",
    appId: "1:921723174722:web:7e04a94d0f4d6dad65d2db"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const bookingsRef = ref(db, "reservas");

  let currentDate = new Date();
  let bookingsData = {};
  let selectedDateKey = null;

  const monthYearEl = document.getElementById("monthYear");
  const calendarDaysEl = document.getElementById("calendarDays");
  const syncStatusEl = document.getElementById("syncStatus");
  const modalBackdrop = document.getElementById("modalBackdrop");
  const modalDateTitle = document.getElementById("modalDateTitle");
  const clientNameInput = document.getElementById("clientName");
  const clientPhoneInput = document.getElementById("clientPhone");
  const clientNotesInput = document.getElementById("clientNotes");
  const deleteBtn = document.getElementById("deleteBtn");

  onValue(bookingsRef, (snapshot) => {
    bookingsData = snapshot.val() || {};
    syncStatusEl.textContent = "Sincronizado en tiempo real";
    renderCalendar();
  });

  function renderCalendar() {
    calendarDaysEl.innerHTML = "";
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const monthName = new Date(year, month).toLocaleDateString("es-ES", { month: "long", year: "numeric" });
    monthYearEl.textContent = monthName;

    const firstDayIndex = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDayIndex; i++) {
      const emptyDiv = document.createElement("div");
      emptyDiv.className = "day empty";
      calendarDaysEl.appendChild(emptyDiv);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateKey = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const dayDiv = document.createElement("div");
      dayDiv.className = "day";
      dayDiv.textContent = day;

      if (bookingsData[dateKey]) {
        dayDiv.classList.add("booked");
      }

      dayDiv.addEventListener("click", () => openModal(dateKey, day, monthName));
      calendarDaysEl.appendChild(dayDiv);
    }
  }

  function openModal(dateKey, day, monthName) {
    selectedDateKey = dateKey;
    modalDateTitle.textContent = `${day} de ${monthName}`;
    const existing = bookingsData[dateKey];

    if (existing) {
      clientNameInput.value = existing.name || "";
      clientPhoneInput.value = existing.phone || "";
      clientNotesInput.value = existing.notes || "";
      deleteBtn.style.display = "block";
    } else {
      clientNameInput.value = "";
      clientPhoneInput.value = "";
      clientNotesInput.value = "";
      deleteBtn.style.display = "none";
    }
    modalBackdrop.classList.add("active");
  }

  function closeModal() {
    modalBackdrop.classList.remove("active");
    selectedDateKey = null;
  }

  document.getElementById("saveBtn").addEventListener("click", async () => {
    if (!selectedDateKey) return;
    const name = clientNameInput.value.trim();
    const phone = clientPhoneInput.value.trim();
    const notes = clientNotesInput.value.trim();

    if (!name) {
      alert("Escribe al menos el nombre de la persona.");
      return;
    }

    await set(ref(db, `reservas/${selectedDateKey}`), { name, phone, notes });
    closeModal();
  });

  deleteBtn.addEventListener("click", async () => {
    if (!selectedDateKey) return;
    if (confirm("¿Liberar esta fecha para que quede disponible de nuevo?")) {
      await remove(ref(db, `reservas/${selectedDateKey}`));
      closeModal();
    }
  });

  document.getElementById("closeBtn").addEventListener("click", closeModal);
  document.getElementById("prevMonth").addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById("nextMonth").addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  renderCalendar();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0284c7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./piscina.jpg" />
  <title>Calendario Del Oasis de Barranquilla</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: #041524; color: #0f172a; padding: 14px; min-height: 100vh; }

    .container {
      position: relative;
      max-width: 480px;
      margin: 0 auto;
      border-radius: 18px;
      padding: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      background-color: #062840;
    }

    .container::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("./piscina.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.85;
      z-index: 0;
      pointer-events: none;
    }

    .container::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(4, 21, 36, 0.45) 0%, rgba(4, 21, 36, 0.22) 50%, rgba(4, 21, 36, 0.45) 100%);
      z-index: 0;
      pointer-events: none;
    }

    .content { position: relative; z-index: 1; }

    .app-title {
      margin: 0 0 14px 0;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.3px;
    }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    header button {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }
    header button:disabled {
      background: rgba(15, 23, 42, 0.55);
      color: rgba(255, 255, 255, 0.45);
      cursor: not-allowed;
      box-shadow: none;
    }
    header h2 {
      margin: 0;
      font-size: 18px;
      text-transform: capitalize;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .weekdays div {
      font-weight: 700;
      font-size: 13px;
      color: #ffffff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
      padding-bottom: 6px;
    }

    .day {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.55);
      color: #ffffff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
    }
    .day.empty { background: transparent; border: none; cursor: default; text-shadow: none; }
    .day.past {
      background: rgba(15, 23, 42, 0.45);
      border-color: rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.45);
      text-shadow: none;
      cursor: not-allowed;
    }
    .day.booked {
      background: rgba(239, 68, 68, 0.78);
      border-color: #fca5a5;
      color: #ffffff;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.85);
      text-decoration: line-through;
      text-decoration-thickness: 2.5px;
    }

    .status-bar {
      margin-top: 14px;
      font-size: 12px;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
      font-weight: 700;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 100;
      overflow-y: auto;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: #fff;
      width: 100%;
      max-width: 400px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }
    .modal h3 { margin-top: 0; color: #0284c7; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #334155; }
    .field input[type="text"], .field input[type="tel"], .field textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }
    .field textarea { resize: vertical; min-height: 70px; }

    .upload-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 10px;
      background: #f0f9ff;
      border: 1.5px dashed #0284c7;
      border-radius: 10px;
      color: #0369a1;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    #receiptInput { display: none; }
    .preview-box {
      display: none;
      margin-top: 8px;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
    }
    .preview-box.visible { display: block; }
    .preview-box img {
      width: 100%;
      max-height: 210px;
      object-fit: contain;
      display: block;
      cursor: zoom-in;
    }
    .remove-img-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(15, 23, 42, 0.78);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .zoom-hint {
      font-size: 11px;
      text-align: center;
      color: #64748b;
      padding: 4px;
      background: #f1f5f9;
    }

    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .actions button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .btn-save { background: #0284c7; color: #fff; }
    .btn-save:disabled { background: #94a3b8; cursor: wait; }
    .btn-delete { background: #ef4444; color: #fff; }
    .btn-close { background: #e2e8f0; color: #334155; }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 100%; max-height: 92vh; border-radius: 8px; }
  </style>
</head>
<body>

<div class="container">
  <div class="content">
    <h1 class="app-title">Calendario Del Oasis de Barranquilla</h1>

    <header>
      <button id="prevMonth" title="Mes anterior">&#9664;</button>
      <h2 id="monthYear"></h2>
      <button id="nextMonth" title="Mes siguiente">&#9654;</button>
    </header>

    <div class="weekdays">
      <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
    </div>
    <div class="days" id="calendarDays"></div>
    <div class="status-bar" id="syncStatus">Conectando con la nube...</div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalDateTitle">Fecha</h3>
    <div class="field">
      <label>Nombre de la persona</label>
      <input type="text" id="clientName" placeholder="Ej. Carlos Pérez" />
    </div>
    <div class="field">
      <label>Número de teléfono</label>
      <input type="tel" id="clientPhone" placeholder="Ej. 300-1234567" />
    </div>
    <div class="field">
      <label>Notas (Día del pago, método y referencia)</label>
      <textarea id="clientNotes" placeholder="Ej. Pagó el 15/12 por Pago Móvil - Ref: 849302"></textarea>
    </div>

    <div class="field">
      <label>Capture del pago (Pago Móvil, transferencia, etc.)</label>
      <label for="receiptInput" class="upload-btn" id="uploadLabel">+ Subir capture del pago</label>
      <input type="file" id="receiptInput" accept="image/*" />
      <div class="preview-box" id="previewBox">
        <button type="button" class="remove-img-btn" id="removeImgBtn">Quitar foto</button>
        <img id="receiptPreview" src="" alt="Capture de pago" />
        <div class="zoom-hint">Toca la imagen para verla en grande</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-save" id="saveBtn">Guardar</button>
      <button class="btn-delete" id="deleteBtn">Liberar</button>
      <button class="btn-close" id="closeBtn">Cerrar</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" title="Toca para cerrar">
  <img id="lightboxImg"

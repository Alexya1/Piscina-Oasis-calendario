  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      background: #041524;
      color: #0f172a;
    }

    .container {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      margin: 0;
      padding: 20px 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: #062840;
    }

    .container::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("https://alexya1.github.io/Piscina-Oasis-calendario/piscina.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.85;
      z-index: 0;
      pointer-events: none;
    }

    .container::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(4, 21, 36, 0.45) 0%, rgba(4, 21, 36, 0.22) 50%, rgba(4, 21, 36, 0.45) 100%);
      z-index: 0;
      pointer-events: none;
    }

    .content { position: relative; z-index: 1; width: 100%; max-width: 600px; margin: 0 auto; }

    .app-title {
      margin: 0 0 6px 0;
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.3px;
    }

    .subtitle-hint {
      margin: 0 0 16px 0;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #e0f2fe;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
    }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    header button {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }
    header button:disabled {
      background: rgba(15, 23, 42, 0.55);
      color: rgba(255, 255, 255, 0.45);
      cursor: not-allowed;
      box-shadow: none;
    }
    header h2 {
      margin: 0;
      font-size: 19px;
      text-transform: capitalize;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
    .weekdays div {
      font-weight: 700;
      font-size: 14px;
      color: #ffffff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
      padding-bottom: 6px;
    }

    .day {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: #ffffff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
      font-weight: 800;
      font-size: 17px;
      cursor: pointer;
      user-select: none;
    }
    .day.empty { background: transparent; border: none; cursor: default; text-shadow: none; }
    .day.past {
      background: rgba(15, 23, 42, 0.45);
      border-color: rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.4);
      text-shadow: none;
      cursor: not-allowed;
    }
    .day.booked {
      background: rgba(239, 68, 68, 0.78);
      border-color: #fca5a5;
      color: #ffffff;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.85);
      text-decoration: line-through;
      text-decoration-thickness: 2.5px;
      cursor: not-allowed;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
    .dot.free { background: rgba(255, 255, 255, 0.35); border: 1px solid #fff; }
    .dot.busy { background: rgba(239, 68, 68, 0.85); border: 1px solid #fca5a5; }

    .status-bar {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
      font-weight: 700;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.78);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .modal h3 { margin: 0 0 6px 0; color: #0284c7; font-size: 18px; }
    .modal p { margin: 0 0 14px 0; font-size: 14px; color: #475569; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }
    .field input[type="text"] {
      width: 100%;
      padding: 11px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    .field input[type="text"]:focus { border-color: #0284c7; }

    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0284c7" />
  <title>Fechas Disponibles - Oasis de Barranquilla</title>
  <meta name="description" content="Fechas Disponibles - Oasis de Barranquilla" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Fechas Disponibles - Oasis de Barranquilla" />
  <meta property="og:description" content="Fechas Disponibles - Oasis de Barranquilla" />
  <meta property="og:image" content="https://alexya1.github.io/Piscina-Oasis-calendario/piscina.jpg" />

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      background: #041524;
      color: #ffffff;
    }

    .container {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      margin: 0;
      padding: 24px 14px;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: #062840;
    }

    .container::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("./piscina.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.85;
      z-index: 0;
      pointer-events: none;
    }

    .container::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(4, 21, 36, 0.45) 0%, rgba(4, 21, 36, 0.22) 50%, rgba(4, 21, 36, 0.45) 100%);
      z-index: 0;
      pointer-events: none;
    }

    .content { position: relative; z-index: 1; width: 100%; max-width: 600px; margin: 0 auto; }

    .app-title {
      margin: 0 0 6px 0;
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    .subtitle-hint {
      margin: 0 0 16px 0;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #e0f2fe;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
    }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    header button {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }
    header button:disabled {
      background: rgba(15, 23, 42, 0.55);
      color: rgba(255, 255, 255, 0.45);
      cursor: not-allowed;
      box-shadow: none;
    }
    header h2 {
      margin: 0;
      font-size: 19px;
      text-transform: capitalize;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
    .weekdays div {
      font-weight: 700;
      font-size: 14px;
      color: #ffffff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
      padding-bottom: 6px;
    }

    .day {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: #ffffff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
      font-weight: 800;
      font-size: 17px;
      cursor: pointer;
      user-select: none;
    }
    .day.empty { background: transparent; border: none; cursor: default; text-shadow: none; }
    .day.past {
      background: rgba(15, 23, 42, 0.45);
      border-color: rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.4);
      text-shadow: none;
      cursor: not-allowed;
    }
    .day.booked {
      background: rgba(239, 68, 68, 0.78);
      border-color: #fca5a5;
      color: #ffffff;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.85);
      text-decoration: line-through;
      text-decoration-thickness: 2.5px;
      cursor: not-allowed;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
    .dot.free { background: rgba(255, 255, 255, 0.35); border: 1px solid #fff; }
    .dot.busy { background: rgba(239, 68, 68, 0.85); border: 1px solid #fca5a5; }

    .status-bar {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
      font-weight: 700;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.78);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: #ffffff;
      color: #0f172a;
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .modal h3 { margin: 0 0 6px 0; color: #0284c7; font-size: 18px; }
    .modal p { margin: 0 0 14px 0; font-size: 14px; color: #475569; }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }
    .field input[type="text"], .field input[type="tel"] {
      width: 100%;
      padding: 11px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    .field input:focus { border-color: #0284c7; }

    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-whatsapp { background: #16a34a; color: #ffffff; }
    .btn-whatsapp:disabled { background: #94a3b8; cursor: wait; }
    .btn-close { background: #e2e8f0; color: #334155; max-width: 100px; }
  </style>
</head>
<body>

<div class="container">
  <div class="content">
    <h1 class="app-title">Fechas Disponibles - Oasis de Barranquilla</h1>
    <p class="subtitle-hint">Toca un día disponible para apartarlo por WhatsApp</p>

    <header>
      <button id="prevMonth" title="Mes anterior">&#9664;</button>
      <h2 id="monthYear"></h2>
      <button id="nextMonth" title="Mes siguiente">&#9654;</button>
    </header>

    <div class="weekdays">
      <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
    </div>
    <div class="days" id="calendarDays"></div>

    <div class="legend">
      <span><i class="dot free"></i> Disponible</span>
      <span><i class="dot busy"></i> Ocupado</span>
    </div>
    <div class="status-bar" id="syncStatus">Cargando fechas disponibles...</div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalDateTitle">Fecha seleccionada</h3>
    <p>Completa tus datos para enviar tu solicitud:</p>
    <div class="field">
      <label for="guestName">Tu nombre</label>
      <input type="text" id="guestName" placeholder="Ej. María Gómez" autocomplete="name" />
    </div>
    <div class="field">
      <label for="guestPhone">Tu número de teléfono</label>
      <input type="tel" id="guestPhone" placeholder="Ej. 0412-1234567" autocomplete="tel" />
    </div>
    <div class="actions">
      <button class="btn-whatsapp" id="sendWhatsappBtn">Enviar solicitud</button>
      <button class="btn-close" id="closeBtn">Cancelar</button>
    </div>
  </div>
</div>

<script>
  var WHATSAPP_NUMBER = "584124342558";
  var DB_BASE = "https://calendario-de-picina-default-rtdb.firebaseio.com";

  var monthYearEl = document.getElementById("monthYear");
  var calendarDaysEl = document.getElementById("calendarDays");
  var syncStatusEl = document.getElementById("syncStatus");
  var prevMonthBtn = document.getElementById("prevMonth");
  var modalBackdrop = document.getElementById("modalBackdrop");
  var modalDateTitle = document.getElementById("modalDateTitle");
  var guestNameInput = document.getElementById("guestName");
  var guestPhoneInput = document.getElementById("guestPhone");
  var sendWhatsappBtn = document.getElementById("sendWhatsappBtn");

  var now = new Date();
  var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var minYear = now.getFullYear();
  var minMonth = now.getMonth();

  var currentDate = new Date(minYear, minMonth, 1);
  var bookingsData = {};
  var selectedDateKey = "";
  var selectedDateText = "";

  function isBeforeCurrentMonth(year, month) {
    return year < minYear || (year === minYear && month < minMonth);
  }

  function updatePrevButtonState() {
    prevMonthBtn.disabled = isBeforeCurrentMonth(currentDate.getFullYear(), currentDate.getMonth() - 1);
  }

  function renderCalendar() {
    calendarDaysEl.innerHTML = "";
    var year = currentDate.getFullYear();
    var month = currentDate.getMonth();

    updatePrevButtonState();

    var monthName = new Date(year, month).toLocaleDateString("es-ES", { month: "long", year: "numeric" });
    monthYearEl.textContent = monthName;

    var firstDayIndex = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();

    for (var i = 0; i < firstDayIndex; i++) {
      var emptyDiv = document.createElement("div");
      emptyDiv.className = "day empty";
      calendarDaysEl.appendChild(emptyDiv);
    }

    for (var day = 1; day <= daysInMonth; day++) {
      var dateKey = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
      var dayDate = new Date(year, month, day);
      var isPastDay = dayDate < todayStart;
      var isBooked = Boolean(bookingsData[dateKey]);

      var dayDiv = document.createElement("div");
      dayDiv.className = "day";
      dayDiv.textContent = day;

      if (isPastDay) {
        dayDiv.classList.add("past");
      } else if (isBooked) {
        dayDiv.classList.add("booked");
        dayDiv.title = "Día ocupado";
      } else {
        (function(dKey, d, mName) {
          dayDiv.addEventListener("click", function() {
            selectedDateKey = dKey;
            selectedDateText = d + " de " + mName;
            modalDateTitle.textContent = selectedDateText;
            guestNameInput.value = "";
            guestPhoneInput.value = "";
            modalBackdrop.classList.add("active");
            setTimeout(function() { guestNameInput.focus(); }, 80);
          });
        })(dateKey, day, monthName);
      }

      calendarDaysEl.appendChild(dayDiv);
    }
  }

  renderCalendar();

  function loadBookings() {
    fetch(DB_BASE + "/reservas.json?t=" + Date.now())
      .then(function(res) { return res.json(); })
      .then(function(data) {
        bookingsData = data || {};
        syncStatusEl.textContent = "Disponibilidad actualizada";
        renderCalendar();
      })
      .catch(function() {
        syncStatusEl.textContent = "Mostrando calendario";
        renderCalendar();
      });
  }

  loadBookings();
  setInterval(loadBookings, 15000);

  function closeModal() {
    modalBackdrop.classList.remove("active");
  }

  sendWhatsappBtn.addEventListener("click", function() {
    var name = guestNameInput.value.trim();
    var phone = guestPhoneInput.value.trim();

    if (!name) {
      alert("Por favor escribe tu nombre.");
      guestNameInput.focus();
      return;
    }
    if (!phone) {
      alert("Por favor escribe tu número de teléfono.");
      guestPhoneInput.focus();
      return;
    }

    sendWhatsappBtn.disabled = true;
    sendWhatsappBtn.textContent = "Enviando...";

    var reqId = selectedDateKey + "_" + Date.now();
    var payload = {
      dateKey: selectedDateKey,
      dateText: selectedDateText,
      name: name,
      phone: phone,
      createdAt: new Date().toISOString()
    };

    var message = "Quiero apartar la piscina para el día " + selectedDateText + ". Mi nombre es " + name + " y mi teléfono es " + phone;
    var waUrl = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(message);

    fetch(DB_BASE + "/solicitudes/" + encodeURIComponent(reqId) + ".json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function() {
        window.location.href = waUrl;
      })
      .catch(function() {
        window.location.href = waUrl;
      });
  });

  document.getElementById("closeBtn").addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", function(e) {
    if (e.target === modalBackdrop) closeModal();
  });

  prevMonthBtn.addEventListener("click", function() {
    var prevMonthDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
    if (!isBeforeCurrentMonth(prevMonthDate.getFullYear(), prevMonthDate.getMonth())) {
      currentDate = prevMonthDate;
      renderCalendar();
    }
  });

  document.getElementById("nextMonth").addEventListener("click", function() {
    currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
    renderCalendar();
  });
</script>
</body>
</html>
